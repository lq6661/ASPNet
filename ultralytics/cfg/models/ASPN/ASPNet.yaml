# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 319 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
#  s: [0.50, 0.50, 1024] # summary: 319 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLO
#  m: [0.50, 1.00, 512] # summary: 409 layers, 20114688 parameters, 20114672 gradients, 68.5 GF LOPss
#  l: [1.00, 1.00, 512] # summary: 631 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
#  x: [1.00, 1.50, 512] # summary: 631 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs
# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, RFAConv, [128, 3, 2]] # 1-P2/4
  - [-1, 1, DFW, [256]]
  - [-1, 1, ARFConv, [256, 3, 2]] # 3-P3/8
  - [-1, 1, C3k2, [256,False]] #4
  - [-1, 1, ARFConv, [256, 3, 2]] # 5-P4/16
  - [-1, 1, C3k2, [512,False]]  #6
  - [-1, 1, ARFConv, [512, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [512, False]] #8
  - [-1, 1, SPPF, [512, 5]] # 9
  - [-1, 2, C2PSA, [512]] # 10

# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  #11
  - [-8, 1, Conv, [256, 3, 2]] # 1-P2/4 12
  - [-1, 1, PDFA, [256]]  #13
  - [[-1, 11, 6], 1, Concat, [1]] #14 cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] #16
  - [-15, 1, Conv, [128, 3, 2]] # 1-P2/4 17
  - [-1, 1, PDFA, [128]]    #18
  - [[-1,16, 4], 1, Concat, [1]] #19 cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 20 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]  #21
  - [-2, 1, Conv, [256, 3, 2]] # 1-P2/4 25 22
  - [-1, 1, PDFA, [256]]    #23
  - [[-1, 21,15], 1, Concat, [1]] #24 cat head P4
  - [-1, 2, C3k2, [256, False]] # 25 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]  #26
  - [-12, 1, Conv, [256, 3, 2]] # 1-P2/4 27
  - [-1, 1, PDFA, [256]] #28
  - [[-1, 26,10], 1, Concat, [1]] #29 cat head P5
  - [-1, 2, C3k2, [512, True]] # 30 (P5/32-large)

  - [[20, 25, 30], 1, Detect, [nc]] #31 Detect(P3, P4, P5)